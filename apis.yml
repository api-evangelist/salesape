name: Salesape
description: >-
  SalesAPE.ai (operated by AI AGENT GROUP LTD, a UK-registered company) builds AI sales
  assistants that automatically engage and qualify inbound leads across email, SMS, web chat,
  and WhatsApp. Its AI agents respond to prospects 24/7, qualify them, and book sales
  appointments so human teams focus on closing. SalesAPE connects to CRMs and automation tools
  including HubSpot, Salesforce, Zoho, and Zapier (100+ integrations), logging and summarizing
  conversations back into the CRM. It was surfaced as a portfolio company of Northzone and added
  to the API Evangelist network. As of this enrichment pass SalesAPE publishes no public
  developer portal, API reference, or OpenAPI; it exposes a customer app, a hosted status page,
  and standard legal pages. Sector: enterprise; AI.
